name: HomeMusic Player debug APK

on:
  push:
    branches:
      - home-music-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Build HomeMusic APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleHomemusicDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeMusic-Player-debug
          path: app/build/outputs/apk/homemusic/debug/*.apk
          if-no-files-found: error
          retention-days: 30
