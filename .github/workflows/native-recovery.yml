name: Recover AURA native Android sources

"on":
  push:
    branches: [native-v0.10.1]
    paths:
      - '.github/workflows/native-recovery.yml'
      - 'native-android/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-native-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Decompile APK baselines on Windows runner
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'

    steps:
      - name: Checkout native migration branch
        uses: actions/checkout@v4
        with:
          ref: native-v0.10.1

      - name: Configure existing Java, Python and Android SDK
        run: |
          set -euo pipefail
          if [ -n "$JAVA_HOME" ]; then
            JAVA_HOME_UNIX="$(cygpath -u "$JAVA_HOME")"
          else
            JAVA_EXE="$(command -v java.exe || command -v java || true)"
            [ -n "$JAVA_EXE" ] || { echo "::error::Java was not found."; exit 1; }
            JAVA_EXE_UNIX="$(cygpath -u "$JAVA_EXE" 2>/dev/null || printf '%s' "$JAVA_EXE")"
            JAVA_HOME_UNIX="$(cd "$(dirname "$JAVA_EXE_UNIX")/.." && pwd -P)"
          fi
          JAVA_RUNTIME="$JAVA_HOME_UNIX/bin/java.exe"
          [ -f "$JAVA_RUNTIME" ] || JAVA_RUNTIME="$JAVA_HOME_UNIX/bin/java"
          [ -f "$JAVA_RUNTIME" ] || { echo "::error::JDK executable is missing."; exit 1; }
          "$JAVA_RUNTIME" -version
          JAVA_SPEC="$("$JAVA_RUNTIME" -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.specification.version = //p' | head -n 1)"
          JAVA_MAJOR="$(printf '%s' "$JAVA_SPEC" | cut -d. -f1)"
          [ -n "$JAVA_MAJOR" ] && [ "$JAVA_MAJOR" -ge 17 ] || { echo "::error::JDK 17 or newer is required."; exit 1; }
          printf 'JAVA_HOME=%s\n' "$(cygpath -w "$JAVA_HOME_UNIX")" >> "$GITHUB_ENV"
          printf '%s\n' "$(cygpath -w "$JAVA_HOME_UNIX/bin")" >> "$GITHUB_PATH"

          PYTHON_CMD="$(command -v python.exe || command -v python || true)"
          PYTHON_BIN_UNIX=""
          if [ -n "$PYTHON_CMD" ] && "$PYTHON_CMD" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 12) else 1)'; then
            PYTHON_BIN_UNIX="$(cygpath -u "$PYTHON_CMD" 2>/dev/null || printf '%s' "$PYTHON_CMD")"
          else
            echo "Bootstrapping portable Python 3.12.10 with Windows PowerShell archive extraction."
            PYTHON_DIR="$RUNNER_TEMP/aura-python-3.12.10"
            PYTHON_ZIP="$RUNNER_TEMP/python-3.12.10-embed-amd64.zip"
            PYTHON_DIR="$(cygpath -u "$PYTHON_DIR")"
            PYTHON_ZIP="$(cygpath -u "$PYTHON_ZIP")"
            mkdir -p "$PYTHON_DIR"
            curl.exe -fL --retry 3 "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" -o "$(cygpath -w "$PYTHON_ZIP")"
            PYTHON_DIR_WIN="$(cygpath -w "$PYTHON_DIR")"
            PYTHON_ZIP_WIN="$(cygpath -w "$PYTHON_ZIP")"
            powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '$PYTHON_ZIP_WIN' -DestinationPath '$PYTHON_DIR_WIN' -Force; Add-Content -LiteralPath '$PYTHON_DIR_WIN\\python312._pth' -Value 'import site'"
            PYTHON_BIN_UNIX="$PYTHON_DIR/python.exe"
            [ -f "$PYTHON_BIN_UNIX" ] || { echo "::error::Portable Python extraction failed."; exit 1; }
            printf '%s\\n' "$PYTHON_DIR_WIN" >> "$GITHUB_PATH"
          fi
          "$PYTHON_BIN_UNIX" -c 'import sys; print(sys.version); raise SystemExit(0 if sys.version_info >= (3, 12) else 1)'
          printf 'AURA_PYTHON=%s\\n' "$PYTHON_BIN_UNIX" >> "$GITHUB_ENV"

          SDK_ROOT_UNIX=""
          for candidate in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" "$LOCALAPPDATA/Android/Sdk" "$USERPROFILE/AppData/Local/Android/Sdk" "C:/Android"; do
            [ -n "$candidate" ] || continue
            p="$(cygpath -u "$candidate" 2>/dev/null || printf '%s' "$candidate")"
            if [ -d "$p/build-tools" ]; then SDK_ROOT_UNIX="$(cd "$p" && pwd -P)"; break; fi
          done
          [ -n "$SDK_ROOT_UNIX" ] || { echo "::error::Android SDK build-tools were not found."; exit 1; }
          BUILD_TOOLS_DIR="$(find "$SDK_ROOT_UNIX/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          [ -f "$BUILD_TOOLS_DIR/aapt.exe" ] || { echo "::error::aapt.exe is missing."; exit 1; }
          printf 'ANDROID_HOME=%s\n' "$(cygpath -w "$SDK_ROOT_UNIX")" >> "$GITHUB_ENV"
          printf 'ANDROID_SDK_ROOT=%s\n' "$(cygpath -w "$SDK_ROOT_UNIX")" >> "$GITHUB_ENV"
          printf 'AURA_AAPT=%s\n' "$(cygpath -w "$BUILD_TOOLS_DIR/aapt.exe")" >> "$GITHUB_ENV"
          echo "Java, Python and Android SDK found."

      - name: Download and verify original and AURA APK baselines
        run: |
          set -euo pipefail
          mkdir -p recovery/downloads recovery/jadx-original recovery/jadx-aura-0302 recovery/jadx-aura-0751 recovery/apktool-aura-0751 recovery/tools
          curl.exe -fL --retry 3 --retry-delay 2 "https://github.com/justman-1/HomeMusic-public/releases/download/v1.14.7/HomeMusic.apk" -o recovery/downloads/HomeMusic-1.14.7.apk
          curl.exe -fL --retry 3 --retry-delay 2 "https://github.com/PlayInSpirits/HomeMusic-Fork/releases/download/v0.30.2/AURA-0.30.apk" -o recovery/downloads/AURA-0.30.2.apk
          curl.exe -fL --retry 3 --retry-delay 2 "https://github.com/PlayInSpirits/HomeMusic-Fork/releases/download/v0.75.1/AURA-0.75.apk" -o recovery/downloads/AURA-0.75.1.apk
          "$AURA_PYTHON" - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          expected = {
              "HomeMusic-1.14.7.apk": "72176dcf191cdbf5f5ea8e99ecc1cb2017fbaf842386ab2ae1436b5537d9a852",
              "AURA-0.30.2.apk": "a568eef8504892850f5415e03106e0fb8246810168b923f1522761c12587413a",
              "AURA-0.75.1.apk": "887052749b5410f474aa9001c9a352000aeceed999d289a18c337de0327c0871",
          }
          root = Path("recovery/downloads")
          for name, wanted in expected.items():
              p = root / name
              actual = sha256(p.read_bytes()).hexdigest()
              if actual != wanted: raise SystemExit(f"SHA-256 mismatch for {name}: {actual}")
              print(f"Verified {name}: {actual} ({p.stat().st_size} bytes)")
          PY

      - name: Download and verify JADX 1.5.6
        run: |
          set -euo pipefail
          curl.exe -fL --retry 3 "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" -o recovery/tools/jadx-1.5.6.zip
          "$AURA_PYTHON" - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile
          p = Path("recovery/tools/jadx-1.5.6.zip")
          got = sha256(p.read_bytes()).hexdigest()
          expected = "545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974"
          if got != expected: raise SystemExit(f"JADX SHA-256 mismatch: {got}")
          with ZipFile(p) as z: z.extractall("recovery/tools/jadx")
          exe = Path("recovery/tools/jadx/bin/jadx.bat")
          if not exe.is_file(): raise SystemExit(f"JADX launcher not found: {exe}")
          print(f"Verified and extracted JADX 1.5.6: {got}")
          PY

      - name: Decompile all three APK baselines with JADX
        run: |
          set -euo pipefail
          JADX_BAT="$(cygpath -w "$PWD/recovery/tools/jadx/bin/jadx.bat")"
          decompile() {
            local apk="$1" output="$2"
            local apk_win output_win
            apk_win="$(cygpath -w "$apk")"
            output_win="$(cygpath -w "$output")"
            echo "Decompiling $apk"
            cmd.exe /d /s /c "\"$JADX_BAT\" --show-bad-code --no-res -d \"$output_win\" \"$apk_win\""
          }
          decompile "recovery/downloads/HomeMusic-1.14.7.apk" "recovery/jadx-original"
          decompile "recovery/downloads/AURA-0.30.2.apk" "recovery/jadx-aura-0302"
          decompile "recovery/downloads/AURA-0.75.1.apk" "recovery/jadx-aura-0751"

      - name: Decode latest AURA resources and Smali with Apktool
        run: |
          set -euo pipefail
          curl.exe -fL --retry 3 "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" -o recovery/tools/apktool_3.0.3.jar
          "$AURA_PYTHON" - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          p=Path("recovery/tools/apktool_3.0.3.jar")
          got=sha256(p.read_bytes()).hexdigest()
          expected="dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423"
          if got != expected: raise SystemExit(f"Apktool SHA-256 mismatch: {got}")
          print(f"Verified Apktool 3.0.3: {got}")
          PY
          java -jar recovery/tools/apktool_3.0.3.jar d -f recovery/downloads/AURA-0.75.1.apk -o recovery/apktool-aura-0751

      - name: Write recovery inventory
        run: |
          "$AURA_PYTHON" - <<'PY'
          from pathlib import Path
          import json
          root=Path("recovery")
          result={"apk_baselines":{}, "jadx_sources":{}, "apktool_smali":0}
          for p in sorted((root/"downloads").glob("*.apk")):
              result["apk_baselines"][p.name]={"bytes":p.stat().st_size}
          for name in ("jadx-original","jadx-aura-0302","jadx-aura-0751"):
              folder=root/name
              result["jadx_sources"][name]={
                  "java_files":sum(1 for p in folder.rglob("*.java")),
                  "kotlin_files":sum(1 for p in folder.rglob("*.kt")),
                  "other_files":sum(1 for p in folder.rglob("*") if p.is_file())
              }
          result["apktool_smali"]=sum(1 for p in (root/"apktool-aura-0751").rglob("*.smali"))
          (root/"recovery-inventory.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          lines=["AURA native recovery inventory","",json.dumps(result,ensure_ascii=False,indent=2),"",
                 "JADX output is a reconstruction aid, not pristine upstream source.",
                 "Use Smali and the actual APK to verify control flow where JADX output is incomplete."]
          (root/"RECOVERY-README.txt").write_text("\n".join(lines),encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Upload native recovery inputs and decompiled source
        uses: actions/upload-artifact@v4
        with:
          name: aura-native-recovery
          path: |
            recovery/downloads/
            recovery/jadx-original/
            recovery/jadx-aura-0302/
            recovery/jadx-aura-0751/
            recovery/apktool-aura-0751/
            recovery/recovery-inventory.json
            recovery/RECOVERY-README.txt
          if-no-files-found: error
          compression-level: 3
          retention-days: 30
