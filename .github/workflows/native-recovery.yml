name: Recover AURA native Android sources

"on":
  push:
    branches: [native-v0.10.1]
    paths:
      - '.github/workflows/native-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-native-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Decompile APK baselines on Windows runner
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'

    steps:
      - name: Checkout native migration branch
        uses: actions/checkout@v4
        with:
          ref: native-v0.10.1

      - name: Configure existing Java, Python and Android SDK
        run: |
          set -euo pipefail
          if [ -n "$JAVA_HOME" ]; then
            JAVA_HOME_UNIX="$(cygpath -u "$JAVA_HOME")"
          else
            JAVA_EXE="$(command -v java.exe || command -v java || true)"
            [ -n "$JAVA_EXE" ] || { echo "::error::Java was not found."; exit 1; }
            JAVA_EXE_UNIX="$(cygpath -u "$JAVA_EXE" 2>/dev/null || printf '%s' "$JAVA_EXE")"
            JAVA_HOME_UNIX="$(cd "$(dirname "$JAVA_EXE_UNIX")/.." && pwd -P)"
          fi
          JAVA_RUNTIME="$JAVA_HOME_UNIX/bin/java.exe"
          [ -f "$JAVA_RUNTIME" ] || JAVA_RUNTIME="$JAVA_HOME_UNIX/bin/java"
          [ -f "$JAVA_RUNTIME" ] || { echo "::error::JDK executable is missing."; exit 1; }
          "$JAVA_RUNTIME" -version
          JAVA_SPEC="$("$JAVA_RUNTIME" -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.specification.version = //p' | head -n 1)"
          JAVA_MAJOR="$(printf '%s' "$JAVA_SPEC" | cut -d. -f1)"
          [ -n "$JAVA_MAJOR" ] && [ "$JAVA_MAJOR" -ge 17 ] || { echo "::error::JDK 17 or newer is required."; exit 1; }
          printf 'JAVA_HOME=%s\n' "$(cygpath -w "$JAVA_HOME_UNIX")" >> "$GITHUB_ENV"
          printf '%s\n' "$(cygpath -w "$JAVA_HOME_UNIX/bin")" >> "$GITHUB_PATH"

          PYTHON_CMD="$(command -v python.exe || command -v python || true)"
          PYTHON_BIN_UNIX=""
          if [ -n "$PYTHON_CMD" ] && "$PYTHON_CMD" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 12) else 1)'; then
            PYTHON_BIN_UNIX="$(cygpath -u "$PYTHON_CMD" 2>/dev/null || printf '%s' "$PYTHON_CMD")"
          else
            echo "Bootstrapping portable Python 3.12.10 with Windows PowerShell archive extraction."
            PYTHON_DIR="$RUNNER_TEMP/aura-python-3.12.10"
            PYTHON_ZIP="$RUNNER_TEMP/python-3.12.10-embed-amd64.zip"
            PYTHON_DIR="$(cygpath -u "$PYTHON_DIR")"
            PYTHON_ZIP="$(cygpath -u "$PYTHON_ZIP")"
            mkdir -p "$PYTHON_DIR"
            curl.exe -fL --retry 3 "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" -o "$(cygpath -w "$PYTHON_ZIP")"
            PYTHON_DIR_WIN="$(cygpath -w "$PYTHON_DIR")"
            PYTHON_ZIP_WIN="$(cygpath -w "$PYTHON_ZIP")"
            powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '$PYTHON_ZIP_WIN' -DestinationPath '$PYTHON_DIR_WIN' -Force; Add-Content -LiteralPath '$PYTHON_DIR_WIN\python312._pth' -Value 'import site'"
            PYTHON_BIN_UNIX="$PYTHON_DIR/python.exe"
            [ -f "$PYTHON_BIN_UNIX" ] || { echo "::error::Portable Python extraction failed."; exit 1; }
            printf '%s\n' "$PYTHON_DIR_WIN" >> "$GITHUB_PATH"
          fi
          "$PYTHON_BIN_UNIX" -c 'import sys; print(sys.version); raise SystemExit(0 if sys.version_info >= (3, 12) else 1)'
          printf 'AURA_PYTHON=%s\n' "$PYTHON_BIN_UNIX" >> "$GITHUB_ENV"

          SDK_ROOT_UNIX=""
          for candidate in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" "$LOCALAPPDATA/Android/Sdk" "$USERPROFILE/AppData/Local/Android/Sdk" "C:/Android"; do
            [ -n "$candidate" ] || continue
            p="$(cygpath -u "$candidate" 2>/dev/null || printf '%s' "$candidate")"
            if [ -d "$p/build-tools" ]; then SDK_ROOT_UNIX="$(cd "$p" && pwd -P)"; break; fi
          done
          [ -n "$SDK_ROOT_UNIX" ] || { echo "::error::Android SDK build-tools were not found."; exit 1; }
          BUILD_TOOLS_DIR="$(find "$SDK_ROOT_UNIX/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          [ -f "$BUILD_TOOLS_DIR/aapt.exe" ] || { echo "::error::aapt.exe is missing."; exit 1; }
          printf 'ANDROID_HOME=%s\n' "$(cygpath -w "$SDK_ROOT_UNIX")" >> "$GITHUB_ENV"
          printf 'ANDROID_SDK_ROOT=%s\n' "$(cygpath -w "$SDK_ROOT_UNIX")" >> "$GITHUB_ENV"
          printf 'AURA_AAPT=%s\n' "$(cygpath -w "$BUILD_TOOLS_DIR/aapt.exe")" >> "$GITHUB_ENV"
          echo "Java, Python and Android SDK found."

      - name: Download and verify original and AURA APK baselines
        run: |
          set -euo pipefail
          mkdir -p recovery/downloads recovery/jadx-original recovery/jadx-aura-0302 recovery/jadx-aura-0751 recovery/apktool-aura-0751 recovery/tools
          curl.exe -fL --retry 3 --retry-delay 2 "https://github.com/justman-1/HomeMusic-public/releases/download/v1.14.7/HomeMusic.apk" -o recovery/downloads/HomeMusic-1.14.7.apk
          curl.exe -fL --retry 3 --retry-delay 2 "https://github.com/PlayInSpirits/AURA-fork-HomeMusic/releases/download/v0.30.2/AURA-0.30.apk" -o recovery/downloads/AURA-0.30.2.apk
          curl.exe -fL --retry 3 --retry-delay 2 "https://github.com/PlayInSpirits/AURA-fork-HomeMusic/releases/download/v0.75.1/AURA-0.75.apk" -o recovery/downloads/AURA-0.75.1.apk
          curl.exe -fL --retry 3 "https://api.github.com/repos/PlayInSpirits/AURA-fork-HomeMusic/releases/tags/v0.75.1" -o recovery/downloads/release-v0.75.1.json
          "$AURA_PYTHON" - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          release=json.loads(Path("recovery/downloads/release-v0.75.1.json").read_text(encoding="utf-8"))
          asset=next((x for x in release.get("assets",[]) if x.get("name")=="AURA-0.75.apk"),None)
          if not asset or not str(asset.get("digest","")).startswith("sha256:"):
              raise SystemExit("GitHub release does not publish a SHA-256 digest for AURA-0.75.apk")
          expected = {
              "HomeMusic-1.14.7.apk": "72176dcf191cdbf5a5ea8e99ecc1cb2017fbaf842386ab2ae1436b5537d9a852",
              "AURA-0.30.2.apk": "a568eef8504892850f5415e03106e0fb8246810168b923f1522761c12587413a",
              "AURA-0.75.1.apk": asset["digest"].removeprefix("sha256:"),
          }
          root = Path("recovery/downloads")
          for name, wanted in expected.items():
              p = root / name
              actual = sha256(p.read_bytes()).hexdigest().strip().lower()
              wanted = wanted.strip().lower()
              if actual != wanted:
                  raise SystemExit(f"SHA-256 mismatch for {name}: actual={actual!r} expected={wanted!r} actual_len={len(actual)} expected_len={len(wanted)}")
              print(f"Verified {name}: {actual} ({p.stat().st_size} bytes)")
          print("AURA 0.75.1 digest source: GitHub release asset metadata")
          PY

      - name: Verify installed AURA identity and signing certificate
        run: |
          set -euo pipefail
          AAPT_UNIX="$(cygpath -u "$AURA_AAPT")"
          "$AAPT_UNIX" dump badging recovery/downloads/AURA-0.75.1.apk > recovery/aura-0751-badging.txt
          grep -F "package: name='app.homemusic' versionCode='7501' versionName='v0.75-1'" recovery/aura-0751-badging.txt
          SDK_ROOT_UNIX="$(cygpath -u "$ANDROID_HOME")"
          BUILD_TOOLS_DIR="$(find "$SDK_ROOT_UNIX/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER_JAR="$BUILD_TOOLS_DIR/lib/apksigner.jar"
          [ -f "$APKSIGNER_JAR" ] || { echo "::error::apksigner.jar is missing."; exit 1; }
          JAVA_HOME_UNIX="$(cygpath -u "$JAVA_HOME")"
          JAVA_RUNTIME="$JAVA_HOME_UNIX/bin/java.exe"
          "$JAVA_RUNTIME" -jar "$APKSIGNER_JAR" verify --verbose --print-certs recovery/downloads/AURA-0.75.1.apk > recovery/aura-0751-signature.txt
          cat recovery/aura-0751-signature.txt
          "$AURA_PYTHON" - <<'PY'
          from pathlib import Path
          import re
          apk=Path("recovery/aura-0751-signature.txt").read_text(encoding="utf-8",errors="replace")
          fingerprints=[]
          for line in apk.splitlines():
              if "certificate SHA-256 digest" not in line:
                  continue
              value=line.split(":",1)[-1]
              match=re.search(r"(?i)([0-9a-f]{2}(?::[0-9a-f]{2}){31}|[0-9a-f]{64})",value)
              if match:
                  fingerprints.append(match.group(1).replace(":","").lower())
          if len(set(fingerprints)) != 1:
              raise SystemExit(f"Expected exactly one APK signer certificate SHA-256 fingerprint, found: {fingerprints!r}")
          actual=fingerprints[0]
          expected="af6f72bc95bc3f8b0141410333b7f754e5afbb4ff04c918ac9ce0d8b29f63874"
          if actual != expected:
              raise SystemExit(f"AURA 0.75.1 signing certificate differs from the verified permanent AURA release: {actual}")
          print("AURA 0.75.1 package/version verified.")
          print("Signer matches the verified AURA 0.75.1 release certificate:",actual)
          PY

      - name: Download and verify JADX 1.5.6
        run: |
          set -euo pipefail
          curl.exe -fL --retry 3 "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" -o recovery/tools/jadx-1.5.6.zip
          "$AURA_PYTHON" - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile
          p = Path("recovery/tools/jadx-1.5.6.zip")
          got = sha256(p.read_bytes()).hexdigest()
          expected = "545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974"
          if got != expected: raise SystemExit(f"JADX SHA-256 mismatch: {got}")
          with ZipFile(p) as z: z.extractall("recovery/tools/jadx")
          exe = Path("recovery/tools/jadx/bin/jadx.bat")
          if not exe.is_file(): raise SystemExit(f"JADX launcher not found: {exe}")
          print(f"Verified and extracted JADX 1.5.6: {got}")
          PY

      - name: Decompile all three APK baselines with JADX
        run: |
          set -euo pipefail
          JADX_BAT="$(cygpath -w "$PWD/recovery/tools/jadx/bin/jadx.bat")"
          decompile() {
            local apk="$1" output="$2"
            local apk_win output_win
            apk_win="$(cygpath -w "$apk")"
            output_win="$(cygpath -w "$output")"
            echo "Decompiling $apk"
            powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '$JADX_BAT' --type-update-limit 100 --show-bad-code --no-res -d '$output_win' '$apk_win'; if (\$LASTEXITCODE -ne 0) { Write-Warning 'JADX reported decompilation errors; preserving partial source for Smali cross-check.' }"
          }
          decompile "recovery/downloads/HomeMusic-1.14.7.apk" "recovery/jadx-original"
          decompile "recovery/downloads/AURA-0.30.2.apk" "recovery/jadx-aura-0302"
          decompile "recovery/downloads/AURA-0.75.1.apk" "recovery/jadx-aura-0751"

      - name: Export a Gradle Android project from AURA 0.75.1
        run: |
          set -euo pipefail
          JADX_BAT="$(cygpath -w "$PWD/recovery/tools/jadx/bin/jadx.bat")"
          APK_WIN="$(cygpath -w "$PWD/recovery/downloads/AURA-0.75.1.apk")"
          OUT_WIN="$(cygpath -w "$PWD/recovery/gradle-export-aura-0751")"
          mkdir -p recovery/gradle-export-aura-0751
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '$JADX_BAT' --type-update-limit 100 --show-bad-code --export-gradle --export-gradle-type android-app -d '$OUT_WIN' '$APK_WIN'; if (\$LASTEXITCODE -ne 0) { Write-Warning 'JADX Gradle export reported decompilation errors; preserving generated files.' }"

      - name: Generate compile-oriented Java with JADX simple mode
        run: |
          set -euo pipefail
          JADX_BAT="$(cygpath -w "$PWD/recovery/tools/jadx/bin/jadx.bat")"
          APK_WIN="$(cygpath -w "$PWD/recovery/downloads/AURA-0.75.1.apk")"
          OUT_WIN="$(cygpath -w "$PWD/recovery/jadx-aura-0751-simple")"
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '$JADX_BAT' --type-update-limit 100 --decompilation-mode simple --show-bad-code --no-res -d '$OUT_WIN' '$APK_WIN'; if (\$LASTEXITCODE -ne 0) { Write-Warning 'JADX simple mode reported per-method errors; preserving generated Java for compile test.' }"
          "$AURA_PYTHON" - <<'PY'
          from pathlib import Path
          root=Path("recovery/jadx-aura-0751-simple/sources")
          files=list(root.rglob("*.java")) if root.is_dir() else []
          if not files:
              raise SystemExit("JADX simple mode did not produce Java sources.")
          print("JADX simple-mode Java files:",len(files))
          bad=sum(p.read_text(encoding="utf-8",errors="replace").count("??") for p in files)
          print("Remaining '??' markers:",bad)
          PY

      - name: Decode latest AURA resources and Smali with Apktool
        run: |
          set -euo pipefail
          curl.exe -fL --retry 3 "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" -o recovery/tools/apktool_3.0.3.jar
          "$AURA_PYTHON" - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          p=Path("recovery/tools/apktool_3.0.3.jar")
          got=sha256(p.read_bytes()).hexdigest()
          expected="dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423"
          if got != expected: raise SystemExit(f"Apktool SHA-256 mismatch: {got}")
          print(f"Verified Apktool 3.0.3: {got}")
          PY
          java -jar recovery/tools/apktool_3.0.3.jar d -f recovery/downloads/AURA-0.75.1.apk -o recovery/apktool-aura-0751

      - name: Generate alternate Java reference with dex2jar and CFR
        run: |
          set -euo pipefail
          mkdir -p recovery/tools/dex2jar recovery/cfr-aura-0751
          curl.exe -fL --retry 3 "https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip" -o recovery/tools/dex-tools-v2.4.zip
          curl.exe -fL --retry 3 "https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar" -o recovery/tools/cfr-0.152.jar
          "$AURA_PYTHON" - <<'PY'
          from hashlib import sha256,md5
          from pathlib import Path
          dex=Path("recovery/tools/dex-tools-v2.4.zip")
          cfr=Path("recovery/tools/cfr-0.152.jar")
          expected_dex="ee7c45eb3c1d2474a6145d8d447e651a736a22d9664b6d3d3be5a5a817dda23a"
          expected_cfr_md5="8a85ada8cec494121246805a5562b82b"
          got_dex=sha256(dex.read_bytes()).hexdigest()
          got_cfr_md5=md5(cfr.read_bytes()).hexdigest()
          if got_dex != expected_dex:
              raise SystemExit(f"dex2jar v2.4 SHA-256 mismatch: {got_dex}")
          if got_cfr_md5 != expected_cfr_md5:
              raise SystemExit(f"CFR 0.152 MD5 mismatch: {got_cfr_md5}")
          if dex.stat().st_size != 19105975 or cfr.stat().st_size != 2162315:
              raise SystemExit("Unexpected dex2jar or CFR release asset size.")
          print("Verified dex2jar v2.4 SHA-256:",got_dex)
          print("Verified CFR 0.152 official MD5:",got_cfr_md5)
          PY

          DEX2JAR_ZIP_WIN="$(cygpath -w "$PWD/recovery/tools/dex-tools-v2.4.zip")"
          DEX2JAR_DIR_WIN="$(cygpath -w "$PWD/recovery/tools/dex2jar")"
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '$DEX2JAR_ZIP_WIN' -DestinationPath '$DEX2JAR_DIR_WIN' -Force"
          D2J_BAT_WIN="$(find recovery/tools/dex2jar -iname 'd2j-dex2jar.bat' -print -quit)"
          [ -n "$D2J_BAT_WIN" ] || { echo "::error::d2j-dex2jar.bat is missing from verified dex2jar v2.4 archive."; exit 1; }
          D2J_BAT_WIN="$(cygpath -w "$D2J_BAT_WIN")"
          APK_WIN="$(cygpath -w "$PWD/recovery/downloads/AURA-0.75.1.apk")"
          DEX2JAR_JAR="recovery/AURA-0.75.1-dex2jar.jar"
          JAR_WIN="$(cygpath -w "$PWD/$DEX2JAR_JAR")"
          LOG_WIN="$(cygpath -w "$PWD/recovery/dex2jar-conversion.log")"
          set +e
          cmd.exe /d /c "\"$D2J_BAT_WIN\" -f -o \"$JAR_WIN\" \"$APK_WIN\" > \"$LOG_WIN\" 2>&1"
          D2J_EXIT=$?
          set -e
          if [ "$D2J_EXIT" -ne 0 ]; then
            cat recovery/dex2jar-conversion.log
            echo "::error::dex2jar could not convert AURA 0.75.1 DEX to a Java archive (exit $D2J_EXIT)."
            exit 1
          fi
          cat recovery/dex2jar-conversion.log
          [ -s "$DEX2JAR_JAR" ] || { echo "::error::dex2jar reported success but did not create $DEX2JAR_JAR."; exit 1; }

          CFR_JAR_WIN="$(cygpath -w "$PWD/recovery/tools/cfr-0.152.jar")"
          DEX2JAR_JAR_WIN="$(cygpath -w "$PWD/$DEX2JAR_JAR")"
          CFR_OUT_WIN="$(cygpath -w "$PWD/recovery/cfr-aura-0751")"
          echo "Decompiling converted AURA JAR with CFR 0.152."
          java -Xmx6g -jar "$CFR_JAR_WIN" "$DEX2JAR_JAR_WIN" --outputdir "$CFR_OUT_WIN" --silent true

          "$AURA_PYTHON" - <<'PY'
          from pathlib import Path
          root=Path("recovery/cfr-aura-0751")
          files=list(root.rglob("*.java"))
          if not files:
              raise SystemExit("CFR did not produce Java files.")
          bad=[]
          for p in files:
              txt=p.read_text(encoding="utf-8",errors="replace")
              count=txt.count("??")
              if count:
                  bad.append((count,p.relative_to(root).as_posix()))
          print("CFR Java files:",len(files))
          print("CFR unresolved '??' markers:",sum(n for n,_ in bad))
          print("CFR files with unresolved markers:",len(bad))
          for n,name in sorted(bad,reverse=True)[:25]:
              print(f"  {n:3} {name}")
          PY

      - name: Write recovery inventory
        run: |
          "$AURA_PYTHON" - <<'PY'
          from pathlib import Path
          import json
          root=Path("recovery")
          result={"apk_baselines":{}, "jadx_sources":{}, "cfr_java_files":0, "apktool_smali":0}
          for p in sorted((root/"downloads").glob("*.apk")):
              result["apk_baselines"][p.name]={"bytes":p.stat().st_size}
          for name in ("jadx-original","jadx-aura-0302","jadx-aura-0751"):
              folder=root/name
              java_count=sum(1 for p in folder.rglob("*.java"))
              kotlin_count=sum(1 for p in folder.rglob("*.kt"))
              other_count=sum(1 for p in folder.rglob("*") if p.is_file())
              if java_count == 0:
                  raise SystemExit(f"JADX produced no Java source files in {name}; refusing to upload an empty recovery.")
              result["jadx_sources"][name]={
                  "java_files":java_count,
                  "kotlin_files":kotlin_count,
                  "other_files":other_count
              }
          result["cfr_java_files"]=sum(1 for p in (root/"cfr-aura-0751").rglob("*.java"))
          result["apktool_smali"]=sum(1 for p in (root/"apktool-aura-0751").rglob("*.smali"))
          gradle=root/"gradle-export-aura-0751"
          gradle_java=sum(1 for p in gradle.rglob("*.java"))
          gradle_manifests=sum(1 for p in gradle.rglob("AndroidManifest.xml"))
          gradle_resources=sum(1 for p in gradle.rglob("res") if p.is_dir())
          gradle_files={p.relative_to(gradle).as_posix() for p in gradle.rglob("*") if p.is_file()}
          required={"settings.gradle","build.gradle","app/build.gradle"}
          root_gradle=required.issubset(gradle_files)
          result["gradle_export_aura_0751"]={
              "java_files":gradle_java,
              "manifest_files":gradle_manifests,
              "resource_directories":gradle_resources,
              "root_gradle_files_present":root_gradle,
              "key_gradle_files":sorted(p for p in gradle_files if p.endswith(".gradle") or p.endswith(".gradle.kts"))
          }
          if gradle_java == 0 or not root_gradle:
              raise SystemExit("JADX Gradle export is incomplete; refusing to upload a non-project.")
          (root/"recovery-inventory.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          lines=["AURA native recovery inventory","",json.dumps(result,ensure_ascii=False,indent=2),"",
                 "JADX output is a reconstruction aid, not pristine upstream source.",
                 "Use Smali and the actual APK to verify control flow where JADX output is incomplete."]
          (root/"RECOVERY-README.txt").write_text("\n".join(lines),encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Prepare Gradle source baseline for native migration
        run: |
          set -euo pipefail
          mkdir -p native-android/project
          cp -a recovery/gradle-export-aura-0751/. native-android/project/
          "$AURA_PYTHON" - <<'PY'
          from pathlib import Path
          import re, json, shutil
          project=Path("native-android/project")

          # Compile the normal structured Java export. JADX simple-mode output is retained as a
          # forensic reference only because it can emit goto-based pseudocode for hard methods.
          structured_sources=Path("recovery/jadx-aura-0751/sources")
          simple_sources=Path("recovery/jadx-aura-0751-simple/sources")
          if not structured_sources.is_dir() or not any(structured_sources.rglob("*.java")):
              raise SystemExit("Structured JADX Java sources are missing.")
          if not simple_sources.is_dir() or not any(simple_sources.rglob("*.java")):
              raise SystemExit("JADX simple-mode reference sources are missing.")
          structured_java=list(structured_sources.rglob("*.java"))
          remaining_bad=[]
          for source_file in structured_java:
              text=source_file.read_text(encoding="utf-8",errors="replace")
              if "??" in text:
                  remaining_bad.append((text.count("??"),source_file.relative_to(structured_sources).as_posix()))
          print("Structured JADX Java files:",len(structured_java))
          print("Remaining unresolved type markers:",sum(n for n,_ in remaining_bad))
          print("Files still needing Smali repair:",len(remaining_bad))
          for n,name in sorted(remaining_bad,reverse=True)[:25]:
              print(f"  {n:3} {name}")
          app_sources=project/"app/src/main/java"
          if app_sources.exists():
              shutil.rmtree(app_sources)
          shutil.copytree(structured_sources,app_sources)

