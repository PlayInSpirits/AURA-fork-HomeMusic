      - name: Build recovered Gradle project (first compile check)
        id: gradle_build
        run: |
          set -euo pipefail
          SDK_ROOT_UNIX="$(cygpath -u "$ANDROID_HOME")"
          SDK_ROOT_WIN="$(cygpath -w "$SDK_ROOT_UNIX")"
          SDK_MANAGER="$SDK_ROOT_UNIX/cmdline-tools/latest/bin/sdkmanager.bat"

          echo "Installing current official Android command-line tools (SDK XML v4 support)."
          CMDLINE_TEMP="$RUNNER_TEMP/aura-commandline-tools"
          CMDLINE_ZIP="$RUNNER_TEMP/commandlinetools-win-15859902_latest.zip"
          CMDLINE_TEMP="$(cygpath -u "$CMDLINE_TEMP")"
          CMDLINE_ZIP="$(cygpath -u "$CMDLINE_ZIP")"
          mkdir -p "$CMDLINE_TEMP" "$SDK_ROOT_UNIX/cmdline-tools"
          curl.exe -fL --retry 3 "https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip" -o "$(cygpath -w "$CMDLINE_ZIP")"
          "$AURA_PYTHON" - "$CMDLINE_ZIP" <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          actual=sha256(p.read_bytes()).hexdigest()
          expected="90ae805d20434428bffcb699c290860f19bb5f66a67e6b330067e3de801fb04a"
          if actual != expected:
              raise SystemExit(f"Android command-line tools SHA-256 mismatch: {actual}")
          print("Verified current Android command-line tools:",actual)
          PY
          CMDLINE_TEMP_WIN="$(cygpath -w "$CMDLINE_TEMP")"
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '$(cygpath -w "$CMDLINE_ZIP")' -DestinationPath '$CMDLINE_TEMP_WIN' -Force"
          rm -rf "$SDK_ROOT_UNIX/cmdline-tools/latest"
          mkdir -p "$SDK_ROOT_UNIX/cmdline-tools/latest"
          cp -a "$CMDLINE_TEMP/cmdline-tools/." "$SDK_ROOT_UNIX/cmdline-tools/latest/"
          SDK_MANAGER="$SDK_ROOT_UNIX/cmdline-tools/latest/bin/sdkmanager.bat"

          if [ ! -f "$SDK_ROOT_UNIX/platforms/android-37.0/android.jar" ]; then
            SDK_MANAGER_WIN="$(cygpath -w "$SDK_MANAGER")"
            echo "Accepting Android SDK licenses and installing Android 17 API 37.0 platform."
            powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "1..100 | ForEach-Object { 'y' } | & '$SDK_MANAGER_WIN' --sdk_root='$SDK_ROOT_WIN' --licenses; if (\$LASTEXITCODE -ne 0) { exit \$LASTEXITCODE }"
            powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '$SDK_MANAGER_WIN' --sdk_root='$SDK_ROOT_WIN' 'platforms;android-37.0' 'build-tools;37.0.0'; if (\$LASTEXITCODE -ne 0) { exit \$LASTEXITCODE }"
          fi
          [ -f "$SDK_ROOT_UNIX/platforms/android-37.0/android.jar" ] || { echo "::error::Android SDK Platform 37.0 installation did not produce android.jar."; exit 1; }

          GRADLE_VERSION="9.6.0"
          GRADLE_DIR="$PWD/recovery/tools/gradle-$GRADLE_VERSION"
          GRADLE_ZIP="$PWD/recovery/tools/gradle-$GRADLE_VERSION-bin.zip"
          GRADLE_SHA="$GRADLE_ZIP.sha256"
          mkdir -p recovery/tools

          curl.exe -fL --retry 3 "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" -o "$GRADLE_ZIP"
          curl.exe -fL --retry 3 "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip.sha256" -o "$GRADLE_SHA"
          "$AURA_PYTHON" - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile
          import re
          archive=Path("recovery/tools/gradle-9.6.0-bin.zip")
          checksum_file=Path(str(archive)+".sha256")
          expected=checksum_file.read_text(encoding="ascii").strip().split()[0].lower()
          actual=sha256(archive.read_bytes()).hexdigest()
          if not re.fullmatch(r"[0-9a-f]{64}",expected) or actual != expected:
              raise SystemExit(f"Gradle 9.6.0 SHA-256 check failed: actual={actual}, expected={expected}")
          target=Path("recovery/tools")
          with ZipFile(archive) as z:
              z.extractall(target)
          gradle=target/"gradle-9.6.0/bin/gradle.bat"
          if not gradle.is_file():
              raise SystemExit(f"Gradle launcher missing after extraction: {gradle}")
          print("Verified Gradle 9.6.0:",actual)
          PY

          GRADLE_BAT="$(cygpath -w "$GRADLE_DIR/bin/gradle.bat")"
          PROJECT_WIN="$(cygpath -w "$PWD/native-android/project")"
          LOG_WIN="$(cygpath -w "$PWD/recovery/gradle-build.log")"
          echo "Starting :app:assembleDebug using JDK 17, AGP 9.4.0, Gradle 9.6.0 and SDK API 37."
          set +e
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '$GRADLE_BAT' --no-daemon --stacktrace -p '$PROJECT_WIN' :app:assembleDebug *> '$LOG_WIN'; exit \$LASTEXITCODE"
          BUILD_EXIT=$?
          set -e
          echo "$BUILD_EXIT" > recovery/gradle-build-exit-code.txt
          cat recovery/gradle-build.log
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error::The recovered Gradle project did not compile. Exact errors are saved in recovery/gradle-build.log."
            exit 1
          fi
          echo "Gradle debug APK build succeeded."
          find native-android/project/app/build/outputs/apk -type f -name '*.apk' -print

