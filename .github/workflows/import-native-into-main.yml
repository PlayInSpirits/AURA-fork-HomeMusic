name: Import native-v0.10.1 into main/aura-native

on:
  push:
    branches: [main]
    paths:
      - 'aura-native-import.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-native-initial-import
  cancel-in-progress: false

jobs:
  import-native:
    name: Copy complete native-v0.10.1 project into main
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        shell: 'C:\\PROGRA~1\\Git\\bin\\bash.exe --noprofile --norc -eo pipefail {0}'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout native-v0.10.1 source
        uses: actions/checkout@v4
        with:
          ref: native-v0.10.1
          path: source-native
          fetch-depth: 0

      - name: Copy and verify every tracked file
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Import must target main."; exit 1; }
          SOURCE_SHA="$(git -C source-native rev-parse HEAD)"
          echo "Source branch: native-v0.10.1"
          echo "Source commit: $SOURCE_SHA"
          TRACKED_COUNT="$(git -C source-native ls-files | wc -l | tr -d ' ')"
          echo "Tracked source files: $TRACKED_COUNT"

          mkdir -p aura-native
          cp -a source-native/. aura-native/
          rm -rf aura-native/.git

          VERIFIED_COUNT=0
          while IFS= read -r -d '' FILE; do
            if [ ! -e "aura-native/$FILE" ]; then
              echo "::error::Missing copied file: $FILE"
              exit 1
            fi
            if ! cmp -s "source-native/$FILE" "aura-native/$FILE"; then
              echo "::error::Content mismatch: $FILE"
              exit 1
            fi
            VERIFIED_COUNT=$((VERIFIED_COUNT + 1))
          done < <(git -C source-native ls-files -z)
          echo "Verified byte-identical tracked files: $VERIFIED_COUNT"
          [ "$VERIFIED_COUNT" -eq "$TRACKED_COUNT" ] || { echo "::error::Tracked file count mismatch."; exit 1; }

          TOO_LARGE="$(find aura-native -type f -size +99M -print || true)"
          if [ -n "$TOO_LARGE" ]; then
            echo "::error::GitHub rejects individual files around 100 MB; oversized files need Git LFS:"
            printf '%s\n' "$TOO_LARGE"
            exit 1
          fi

          printf 'Imported from branch: native-v0.10.1\nSource commit: %s\nDestination: main/aura-native/\nOriginal native-v0.10.1 branch is preserved.\n' "$SOURCE_SHA" > aura-native/IMPORT-SOURCE.txt
          git add -f --all -- aura-native
          if git diff --cached --quiet; then
            echo "The current copy is already present; no changes to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Import complete native-v0.10.1 project under aura-native"
          git push origin HEAD:refs/heads/main

      - name: Verify imported tree
        if: success()
        run: |
          set -euo pipefail
          test -f aura-native/IMPORT-SOURCE.txt
          test -d aura-native/native-android/project
          test -f aura-native/.github/workflows/native-build.yml
          echo "Imported project structure verified."
