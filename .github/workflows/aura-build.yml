name: Build AURA Android

"on":
  push:
    branches: [main]
    paths-ignore:
      - 'aura-android/**'
      - 'app/latest.json'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: aura-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup-obsolete-cloud-runs:
    if: ${{ contains(github.event.head_commit.message || '', '[actions-cleanup-only]') }}
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Delete obsolete GitHub-hosted workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runIds = [43096632613, 43096813486, 43097352545];
            for (const run_id of runIds) {
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id });
                core.info(`Deleted obsolete GitHub-hosted workflow run ${run_id}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Workflow run ${run_id} is already absent`);
                } else {
                  core.error(`Could not delete workflow run ${run_id}: HTTP ${error.status}`);
                  throw error;
                }
              }
            }

  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[actions-cleanup-only]') }}
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        shell: bash
    steps:
      - name: Cancel obsolete GitHub-hosted builds
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runIds = [43096632613, 43096813486, 43097352545];
            for (const run_id of runIds) {
              let cancellationRequested = false;
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id });
                cancellationRequested = true;
                core.info(`Cancellation requested for obsolete run ${run_id}`);
              } catch (error) {
                if (error.status === 409) {
                  try {
                    await github.request(
                      'POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel',
                      { owner, repo, run_id }
                    );
                    cancellationRequested = true;
                    core.info(`Force-cancellation requested for obsolete run ${run_id}`);
                  } catch (forceError) {
                    if ([404, 409, 422].includes(forceError.status)) {
                      core.warning(`Run ${run_id} could not be force-cancelled (HTTP ${forceError.status}).`);
                    } else {
                      throw forceError;
                    }
                  }
                } else if ([404, 422].includes(error.status)) {
                  core.warning(`Run ${run_id} was already finished or could not be cancelled (HTTP ${error.status}).`);
                } else {
                  throw error;
                }
              }

              if (cancellationRequested) {
                let current;
                for (let attempt = 0; attempt < 12; attempt++) {
                  const response = await github.rest.actions.getWorkflowRun({ owner, repo, run_id });
                  current = response.data;
                  if (current.status === 'completed') break;
                  await new Promise(resolve => setTimeout(resolve, 1500));
                }
                if (current?.status === 'completed' && current?.conclusion === 'cancelled') {
                  await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id });
                  core.info(`Cancelled and deleted obsolete run ${run_id}`);
                } else {
                  core.warning(`Run ${run_id} did not reach cancelled state; latest status: ${current?.status || 'unknown'}.`);
                }
              }
            }

      - name: Checkout AURA sources
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK and build tools (Windows)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $javaHome = $env:JAVA_HOME
          if ([string]::IsNullOrWhiteSpace($javaHome)) { throw 'JAVA_HOME was not set by setup-java.' }
          $javaExe = Join-Path $javaHome 'bin\java.exe'
          if (-not (Test-Path -LiteralPath $javaExe)) { throw "Java executable not found: $javaExe" }

          $validPath = @()
          foreach ($entry in ($env:Path -split ';')) {
            $candidate = $entry.Trim().Trim('"')
            if (-not [string]::IsNullOrWhiteSpace($candidate) -and (Test-Path -LiteralPath $candidate -ErrorAction SilentlyContinue)) {
              $validPath += $candidate
            }
          }
          $javaBin = Join-Path $javaHome 'bin'
          $env:Path = (@($javaBin) + $validPath | Select-Object -Unique) -join ';'
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$env:Path" -Encoding ASCII
          Write-Host "Using Java from $javaHome"
          & $javaExe -version
          if ($LASTEXITCODE -ne 0) { throw 'Java runtime check failed.' }

          $sdkBase = $env:RUNNER_TOOL_CACHE
          if ([string]::IsNullOrWhiteSpace($sdkBase)) { $sdkBase = $env:RUNNER_TEMP }
          $sdkRoot = Join-Path $sdkBase 'android-sdk'
          $cmdlineRoot = Join-Path $sdkRoot 'cmdline-tools\latest'
          $sdkManager = Join-Path $cmdlineRoot 'bin\sdkmanager.bat'

          if (-not (Test-Path $sdkManager)) {
            $zipPath = Join-Path $env:RUNNER_TEMP 'android-commandlinetools-12266719.zip'
            $extractDir = Join-Path $env:RUNNER_TEMP 'android-commandlinetools-12266719'
            $downloadUrl = 'https://dl.google.com/android/repository/commandlinetools-win-12266719_latest.zip'

            New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null
            Remove-Item -LiteralPath $extractDir -Recurse -Force -ErrorAction SilentlyContinue
            Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath
            Expand-Archive -LiteralPath $zipPath -DestinationPath $extractDir -Force

            $sourceTools = Join-Path $extractDir 'cmdline-tools'
            if (-not (Test-Path (Join-Path $sourceTools 'bin\sdkmanager.bat'))) {
              throw 'Android command-line tools archive has an unexpected structure.'
            }
            New-Item -ItemType Directory -Force -Path $cmdlineRoot | Out-Null
            Copy-Item -Path (Join-Path $sourceTools '*') -Destination $cmdlineRoot -Recurse -Force
          }

          $env:ANDROID_HOME = $sdkRoot
          $env:ANDROID_SDK_ROOT = $sdkRoot
          $licenseAnswers = (1..50 | ForEach-Object { 'y' }) -join "`r`n"
          $licenseAnswers | & $sdkManager "--sdk_root=$sdkRoot" --licenses
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK license acceptance failed.' }

          & $sdkManager "--sdk_root=$sdkRoot" 'platform-tools' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK build-tools installation failed.' }

          Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_HOME=$sdkRoot" -Encoding ASCII
          Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_SDK_ROOT=$sdkRoot" -Encoding ASCII
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $sdkRoot 'platform-tools') -Encoding ASCII
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $sdkRoot 'build-tools\35.0.0') -Encoding ASCII

      - name: Install Apktool 3.0.3
        run: |
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o apktool.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar" | sha256sum -c -

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python image libraries
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Download original HomeMusic APK
        run: |
          mkdir -p build
          curl -fL https://github.com/justman-1/HomeMusic-public/releases/download/v1.14.7/HomeMusic.apk -o build/HomeMusic-original.apk
          echo "72176dcf191cdbf5a5ea8e99ecc1cb2017fbaf842386ab2ae1436b5537d9a852  build/HomeMusic-original.apk" | sha256sum -c -

      - name: Validate patcher syntax
        run: python -m py_compile tools/patch_aura.py

      - name: Decode and apply AURA patch
        run: |
          java -jar apktool.jar d -f build/HomeMusic-original.apk -o build/decoded
          python tools/patch_aura.py build/decoded assets/aura_logo.png
          grep -F 'Lapp/homemusic/AURAVersion;->versionName' build/decoded/smali/vb4.smali
          grep -F 'Lapp/homemusic/AURAVersion;->versionCode' build/decoded/smali/com/eddyizm/tempus/homemusic/HubUpdater.smali
          grep -F 'https://raw.githubusercontent.com/PlayInSpirits/HomeMusic-Fork/main' build/decoded/smali/rr1.smali
          grep -F 'https://github.com/PlayInSpirits/HomeMusic-Fork/releases/download/' build/decoded/smali/d25.smali
          grep -F 'auraHubEnter' build/decoded/smali/com/eddyizm/tempus/homemusic/HubFragment.smali
          grep -F 'aura_bottom_nav_island' build/decoded/res/layout/activity_main.xml
          grep -F 'aura_wave_play_button' build/decoded/res/layout/homemusic_home_mixes.xml
          grep -F 'android:duration="240"' build/decoded/res/drawable/aura_aurora_background.xml

      - name: Rebuild and verify unsigned package
        run: |
          set -euo pipefail
          java -jar apktool.jar b build/decoded -o build/AURA-0.75-unsigned.apk
          zipalign -f -p 4 build/AURA-0.75-unsigned.apk build/AURA-0.75-aligned.apk
          aapt dump badging build/AURA-0.75-aligned.apk | tee build/badging-unsigned.txt
          grep -F "package: name='app.homemusic'" build/badging-unsigned.txt
          grep -F "versionName='v0.75-1'" build/badging-unsigned.txt
          grep -F "versionCode='7501'" build/badging-unsigned.txt
          grep -F "application: label='AURA'" build/badging-unsigned.txt

      - name: Check for permanent signing key
        id: signing_key
        env:
          AURA_KEYSTORE_BASE64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AURA_KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Validation build passed. Release publication is waiting for the permanent AURA signing key. Run tools/configure-signing.ps1 once from Windows."
          fi

      - name: Sign APK with the permanent AURA key
        if: steps.signing_key.outputs.configured == 'true'
        env:
          AURA_KEYSTORE_BASE64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
          AURA_KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
          AURA_KEY_ALIAS: ${{ secrets.AURA_KEY_ALIAS }}
          AURA_KEY_PASSWORD: ${{ secrets.AURA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$AURA_KEYSTORE_PASSWORD" ] || [ -z "$AURA_KEY_ALIAS" ]; then
            echo "::error::Permanent signing secrets are incomplete."
            exit 1
          fi
          echo "$AURA_KEYSTORE_BASE64" | base64 --decode > build/aura-release.jks
          STORE_PASS="$AURA_KEYSTORE_PASSWORD"
          KEY_ALIAS="$AURA_KEY_ALIAS"
          KEY_PASS="${AURA_KEY_PASSWORD:-$AURA_KEYSTORE_PASSWORD}"
          keytool -list -keystore build/aura-release.jks -alias "$KEY_ALIAS" -storepass "$STORE_PASS" >/dev/null
          apksigner sign --ks build/aura-release.jks --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$KEY_ALIAS" --out build/AURA-0.75.apk build/AURA-0.75-aligned.apk
          apksigner verify --verbose --print-certs build/AURA-0.75.apk | tee build/signature.txt
          aapt dump badging build/AURA-0.75.apk | tee build/badging.txt
          grep -F "package: name='app.homemusic'" build/badging.txt
          grep -F "versionName='v0.75-1'" build/badging.txt
          grep -F "versionCode='7501'" build/badging.txt
          grep -F "application: label='AURA'" build/badging.txt

      - name: Prepare GitHub update feed and source archive
        if: steps.signing_key.outputs.configured == 'true'
        run: |
          set -euo pipefail
          rm -rf aura-android
          mkdir -p aura-android app build/source
          cp -a build/decoded/. aura-android/
          cat > aura-android/README.md <<'EOF'
          # AURA v0.75-1 Android project

          Complete decoded Apktool project used to build AURA v0.75-1.
          Includes Android resources, assets, native libraries and Smali sources.
          Build with Apktool 3.0.3: `java -jar apktool.jar b aura-android -o AURA-0.75-unsigned.apk`.

          This is a complete decompiled/rebuildable project, not the upstream Kotlin/Java Gradle source repository.
          EOF
          APK_SIZE=$(python -c "from pathlib import Path; print(Path('build/AURA-0.75.apk').stat().st_size)")
          APK_SHA256=$(sha256sum build/AURA-0.75.apk | awk '{print $1}')
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v0.75.1/AURA-0.75.apk"
          cat > app/latest.json <<EOF
          {
            "versionCode": 7501,
            "versionName": "v0.75-1",
            "url": "$APK_URL",
            "size": $APK_SIZE,
            "sha256": "$APK_SHA256",
            "notes": "",
            "patches": [],
            "full": {
              "url": "$APK_URL",
              "size": $APK_SIZE,
              "sha256": "$APK_SHA256"
            }
          }
          EOF
          python - <<'PY'
          import json, pathlib
          data=json.loads(pathlib.Path("app/latest.json").read_text(encoding="utf-8"))
          assert data["versionName"] == "v0.75-1" and data["versionCode"] == 7501
          assert data["url"] == data["full"]["url"]
          assert len(data["sha256"]) == 64 and len(data["full"]["sha256"]) == 64
          assert data["size"] > 0 and data["size"] == data["full"]["size"]
          print("AURA update feed JSON validated.")
          PY
          cp README.md LICENSE build/source/
          cp -R tools assets .github aura-android app build/source/
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          base = Path("build")
          with ZipFile(base / "AURA-0.75-source.zip", "w", ZIP_DEFLATED, compresslevel=9) as archive:
              for item in (base / "source").rglob("*"):
                  if item.is_file():
                      archive.write(item, item.relative_to(base))
          PY

      - name: Publish decoded Android source and update feed
        if: steps.signing_key.outputs.configured == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura-android app/latest.json assets
          if ! git diff --cached --quiet; then
            git commit -m "Publish AURA v0.75-1 Android source and update feed"
          fi
          git push origin HEAD:main
          git push --force origin HEAD:pre-release
          git tag -f v0.75.1 HEAD
          git push --force origin refs/tags/v0.75.1

      - name: Create AURA pre-release and upload files
        if: steps.signing_key.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = 'v0.75.1';
            const body = [
              '### **AURA v0.75-1**',
              '- APK подписан постоянным ключом AURA; установка поверх предыдущей версии сохраняет данные приложения.'
            ].join('\n');

            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
              ({ data: release } = await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: 'main',
                name: '0.75.1',
                body,
                draft: false,
                prerelease: true
              }));
            }

            await github.rest.repos.updateRelease({
              owner, repo,
              release_id: release.id,
              name: '0.75.1',
              body,
              draft: false,
              prerelease: true
            });

            const assets = [
              { path: 'build/AURA-0.75.apk', name: 'AURA-0.75.apk', contentType: 'application/vnd.android.package-archive' },
              { path: 'build/AURA-0.75-source.zip', name: 'AURA-0.75-source.zip', contentType: 'application/zip' }
            ];
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100
            });

            for (const asset of assets) {
              for (const previous of existing.filter(item => item.name === asset.name)) {
                await github.rest.repos.deleteReleaseAsset({
                  owner, repo, asset_id: previous.id
                });
              }
              const data = fs.readFileSync(asset.path);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo,
                release_id: release.id,
                name: asset.name,
                data,
                headers: {
                  'content-type': asset.contentType,
                  'content-length': data.length
                }
              });
              core.info(`Uploaded ${asset.name} (${data.length} bytes)`);
            }
