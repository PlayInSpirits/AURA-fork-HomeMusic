name: Build AURA Android

"on":
  push:
    branches: [main]
    paths-ignore:
      - 'aura-android/**'
      - 'app/latest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-pr7-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AURA sources
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Apktool 3.0.3
        run: |
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o apktool.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar" | sha256sum -c -

      - name: Install Python image libraries
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Download original HomeMusic APK
        run: |
          mkdir -p build
          curl -fL https://github.com/justman-1/HomeMusic-public/releases/download/v1.14.7/HomeMusic.apk -o build/HomeMusic-original.apk
          echo "72176dcf191cdbf5a5ea8e99ecc1cb2017fbaf842386ab2ae1436b5537d9a852  build/HomeMusic-original.apk" | sha256sum -c -

      - name: Validate patcher syntax
        run: python -m py_compile tools/patch_aura.py

      - name: Decode and apply AURA patch
        run: |
          java -jar apktool.jar d -f build/HomeMusic-original.apk -o build/decoded
          python tools/patch_aura.py build/decoded assets/aura_logo.png
          grep -F 'Lapp/homemusic/AURAVersion;->versionName' build/decoded/smali/vb4.smali
          grep -F 'Lapp/homemusic/AURAVersion;->versionCode' build/decoded/smali/com/eddyizm/tempus/homemusic/HubUpdater.smali
          grep -F 'https://raw.githubusercontent.com/PlayInSpirits/HomeMusic-Fork/main' build/decoded/smali/rr1.smali
          grep -F 'https://github.com/PlayInSpirits/HomeMusic-Fork/releases/download/' build/decoded/smali/d25.smali
          grep -F 'auraHubEnter' build/decoded/smali/com/eddyizm/tempus/homemusic/HubFragment.smali
          grep -F 'aura_bottom_nav_island' build/decoded/res/layout/activity_main.xml
          grep -F 'aura_wave_play_button' build/decoded/res/layout/homemusic_home_mixes.xml
          grep -F 'android:duration="240"' build/decoded/res/drawable/aura_aurora_background.xml

      - name: Rebuild and verify unsigned package
        run: |
          set -euo pipefail
          java -jar apktool.jar b build/decoded -o build/AURA-pr7.0-1-unsigned.apk
          zipalign -f -p 4 build/AURA-pr7.0-1-unsigned.apk build/AURA-pr7.0-1-aligned.apk
          aapt dump badging build/AURA-pr7.0-1-aligned.apk | tee build/badging-unsigned.txt
          grep -F "package: name='app.homemusic'" build/badging-unsigned.txt
          grep -F "versionName='pr7.0-1'" build/badging-unsigned.txt
          grep -F "versionCode='7001'" build/badging-unsigned.txt
          grep -F "application-label:'AURA'" build/badging-unsigned.txt

      - name: Check for permanent signing key
        id: signing_key
        env:
          AURA_KEYSTORE_BASE64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AURA_KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Validation build passed. Release publication is waiting for the permanent AURA signing key. Run tools/configure-signing.ps1 once from Windows."
          fi

      - name: Sign APK with the permanent AURA key
        if: steps.signing_key.outputs.configured == 'true'
        env:
          AURA_KEYSTORE_BASE64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
          AURA_KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
          AURA_KEY_ALIAS: ${{ secrets.AURA_KEY_ALIAS }}
          AURA_KEY_PASSWORD: ${{ secrets.AURA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$AURA_KEYSTORE_PASSWORD" ] || [ -z "$AURA_KEY_ALIAS" ]; then
            echo "::error::Permanent signing secrets are incomplete."
            exit 1
          fi
          echo "$AURA_KEYSTORE_BASE64" | base64 --decode > build/aura-release.jks
          STORE_PASS="$AURA_KEYSTORE_PASSWORD"
          KEY_ALIAS="$AURA_KEY_ALIAS"
          KEY_PASS="${AURA_KEY_PASSWORD:-$AURA_KEYSTORE_PASSWORD}"
          keytool -list -keystore build/aura-release.jks -alias "$KEY_ALIAS" -storepass "$STORE_PASS" >/dev/null
          apksigner sign --ks build/aura-release.jks --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$KEY_ALIAS" --out build/AURA-pr7.0-1.apk build/AURA-pr7.0-1-aligned.apk
          apksigner verify --verbose --print-certs build/AURA-pr7.0-1.apk | tee build/signature.txt
          aapt dump badging build/AURA-pr7.0-1.apk | tee build/badging.txt
          grep -F "package: name='app.homemusic'" build/badging.txt
          grep -F "versionName='pr7.0-1'" build/badging.txt
          grep -F "versionCode='7001'" build/badging.txt
          grep -F "application-label:'AURA'" build/badging.txt

      - name: Prepare GitHub update feed and source archive
        if: steps.signing_key.outputs.configured == 'true'
        run: |
          set -euo pipefail
          rm -rf aura-android
          mkdir -p aura-android app build/source
          cp -a build/decoded/. aura-android/
          cat > aura-android/README.md <<'EOF'
          # AURA pr7.0-1 Android project

          Complete decoded Apktool project used to build AURA pr7.0-1.
          Includes Android resources, assets, native libraries and Smali sources.
          Build with Apktool 3.0.3: `java -jar apktool.jar b aura-android -o AURA-pr7.0-1-unsigned.apk`.

          This is a complete decompiled/rebuildable project, not the upstream Kotlin/Java Gradle source repository.
          EOF
          APK_SIZE=$(stat -c '%s' build/AURA-pr7.0-1.apk)
          APK_SHA256=$(sha256sum build/AURA-pr7.0-1.apk | awk '{print $1}')
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/pr7.0-1/AURA-pr7.0-1.apk"
          cat > app/latest.json <<EOF
          {
            "versionCode": 7001,
            "versionName": "pr7.0-1",
            "url": "$APK_URL",
            "size": $APK_SIZE,
            "sha256": "$APK_SHA256",
            "notes": "Обновлён главный экран «Моя волна», замедлен многослойный градиент, нижняя панель оформлена как плавающий островок, исправлены панель Ассистента, дубликаты в каталоге и ссылка загрузки обновления.",
            "patches": [],
            "full": {
              "url": "$APK_URL",
              "size": $APK_SIZE,
              "sha256": "$APK_SHA256"
            }
          }
          EOF
          python - <<'PY'
          import json, pathlib
          data=json.loads(pathlib.Path("app/latest.json").read_text(encoding="utf-8"))
          assert data["versionName"] == "pr7.0-1" and data["versionCode"] == 7001
          assert data["url"] == data["full"]["url"]
          assert len(data["sha256"]) == 64 and len(data["full"]["sha256"]) == 64
          assert data["size"] > 0 and data["size"] == data["full"]["size"]
          print("AURA update feed JSON validated.")
          PY
          cp README.md LICENSE HomeMusic.rar build/source/
          cp -R tools assets .github aura-android app build/source/
          (cd build && zip -qr AURA-pr7.0-1-source.zip source)

      - name: Publish GitHub pre-release
        if: steps.signing_key.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: |
            - Новый главный экран «МОЯ ВОЛНА»: крупный заголовок и отдельная кнопка запуска.
            - Плавный многослойный градиент теперь используется как фон только музыкального главного экрана.
            - Нижняя навигация оформлена как плавающая стеклянная панель.
            - В каталоге Хаба убраны дублирующие «Моя волна» и «Микс дня», панель Ассистента не перекрывает подсказки и элементы плеера.
            - Настройки чистой установки: очередь 50 треков, случайный fallback и синхронизация избранного/очереди включены, экономия трафика выключена.
            - Обновлён загрузчик APK: разрешены GitHub release assets репозитория AURA; размер и SHA-256 проверяются.
            - APK подписан новым постоянным ключом AURA. Все последующие версии должны собираться тем же ключом.
        run: |
          set -euo pipefail
          if gh release view pr7.0-1 >/dev/null 2>&1; then
            gh release upload pr7.0-1 build/AURA-pr7.0-1.apk build/AURA-pr7.0-1-source.zip --clobber
            gh release edit pr7.0-1 --title "AURA pr7.0-1" --notes "$RELEASE_NOTES" --prerelease
          else
            gh release create pr7.0-1 build/AURA-pr7.0-1.apk build/AURA-pr7.0-1-source.zip --target "$GITHUB_SHA" --title "AURA pr7.0-1" --notes "$RELEASE_NOTES" --prerelease
          fi

      - name: Publish decoded Android source and update feed
        if: steps.signing_key.outputs.configured == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura-android app/latest.json assets
          if ! git diff --cached --quiet; then
            git commit -m "Publish AURA pr7.0-1 Android source and update feed"
          fi
          git push origin HEAD:main
          git push --force origin HEAD:pre-release
          git tag -f pr7.0-1 HEAD
          git push --force origin refs/tags/pr7.0-1
