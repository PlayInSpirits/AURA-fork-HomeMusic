name: AURA-native test deps (Robolectric)

# Resolves the Robolectric dependency closure (part of it lives on Google Maven only)
# and attaches it to a draft release so the boot smoke test can run outside the runner.
"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deps:
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        shell: 'C:\\PROGRA~1\\Git\\bin\\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - name: Resolve Robolectric closure
        run: |
          set -euo pipefail
          GRADLE_BAT="$(cygpath -u "$RUNNER_TOOL_CACHE")/aura-gradle-9.6.0/bin/gradle.bat"
          [ -f "$GRADLE_BAT" ] || { echo "::error::Gradle 9.6.0 not bootstrapped (run the release workflow first)."; exit 1; }
          P="$(cygpath -u "$RUNNER_TEMP")/robodeps"
          rm -rf "$P"; mkdir -p "$P"
          cat > "$P/settings.gradle" <<'G'
          dependencyResolutionManagement {
              repositories {
                  google { metadataSources { mavenPom(); artifact() } }
                  mavenCentral { metadataSources { mavenPom(); artifact() } }
              }
          }
          rootProject.name = 'robodeps'
          G
          cat > "$P/build.gradle" <<'G'
          configurations { robo }
          dependencies {
              robo 'org.robolectric:robolectric:4.14.1'
              robo 'junit:junit:4.13.2'
          }
          tasks.register('collect', Copy) {
              from configurations.robo
              into layout.buildDirectory.dir('deps')
          }
          G
          sed -i 's/^          //' "$P/settings.gradle" "$P/build.gradle"
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '$(cygpath -w "$GRADLE_BAT")' --no-daemon -q -p '$(cygpath -w "$P")' collect; exit \$LASTEXITCODE"
          ls -la "$P/build/deps"
          (cd "$P/build/deps" && powershell.exe -NoLogo -NoProfile -Command "Compress-Archive -Path * -DestinationPath '$(cygpath -w "$P")\\robolectric-deps.zip' -Force")
          echo "DEPS_ZIP=$P/robolectric-deps.zip" >> "$GITHUB_ENV"

      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          ID="$(curl.exe -sS -H "$AUTH" "$API/releases?per_page=100" | python -c "import json,sys; print(next((str(r['id']) for r in json.load(sys.stdin) if r.get('name')=='ci-robolectric-deps'),''))" 2>/dev/null || true)"
          if [ -z "$ID" ]; then
            ID="$(curl.exe -sS -X POST -H "$AUTH" -H "Content-Type: application/json" "$API/releases" -d '{"tag_name":"ci-robolectric-deps","name":"ci-robolectric-deps","draft":true,"body":""}' | python -c "import json,sys; print(json.load(sys.stdin)['id'])")"
          fi
          curl.exe -sS -f -X POST -H "$AUTH" -H "Content-Type: application/zip" --data-binary "@$(cygpath -w "$DEPS_ZIP")" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=robolectric-deps-$GITHUB_RUN_ID.zip" > /dev/null
          echo "Uploaded to draft release $ID"
