name: Build AURA 0.5-1

"on":
  push:
    branches: [main]
    paths-ignore:
      - 'aura-android/**'
      - 'app/latest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AURA sources
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Apktool 3.0.3
        run: |
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o apktool.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar" | sha256sum -c -

      - name: Install Python image libraries
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Download original HomeMusic APK
        run: |
          mkdir -p build
          curl -fL https://github.com/justman-1/HomeMusic-public/releases/download/v1.14.7/HomeMusic.apk -o build/HomeMusic-original.apk
          echo "72176dcf191cdbf5a5ea8e99ecc1cb2017fbaf842386ab2ae1436b5537d9a852  build/HomeMusic-original.apk" | sha256sum -c -

      - name: Validate AURA patcher syntax
        run: python -m py_compile tools/patch_aura.py

      - name: Decode and apply AURA patch
        run: |
          java -jar apktool.jar d -f build/HomeMusic-original.apk -o build/decoded
          python tools/patch_aura.py build/decoded assets/aura_logo.png
          grep -F 'Lapp/homemusic/AURAVersion;->versionName' build/decoded/smali/vb4.smali
          grep -F 'Lapp/homemusic/AURAVersion;->versionCode' build/decoded/smali/com/eddyizm/tempus/homemusic/HubUpdater.smali
          grep -F 'https://raw.githubusercontent.com/PlayInSpirits/HomeMusic-Fork/main' build/decoded/smali/rr1.smali
          grep -F 'auraHubEnter' build/decoded/smali/com/eddyizm/tempus/homemusic/HubFragment.smali
          grep -F 'aura_contact_author' build/decoded/res/xml/global_preferences.xml

      - name: Rebuild, align and sign
        env:
          AURA_KEYSTORE_BASE64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
          AURA_KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
          AURA_KEY_ALIAS: ${{ secrets.AURA_KEY_ALIAS }}
          AURA_KEY_PASSWORD: ${{ secrets.AURA_KEY_PASSWORD }}
        run: |
          java -jar apktool.jar b build/decoded -o build/AURA-0.5-1-unsigned.apk
          zipalign -f -p 4 build/AURA-0.5-1-unsigned.apk build/AURA-0.5-1-aligned.apk
          if [ -n "$AURA_KEYSTORE_BASE64" ]; then
            echo "$AURA_KEYSTORE_BASE64" | base64 --decode > build/aura-signing.jks
            STORE_PASS="$AURA_KEYSTORE_PASSWORD"
            KEY_ALIAS="$AURA_KEY_ALIAS"
            KEY_PASS="${AURA_KEY_PASSWORD:-$AURA_KEYSTORE_PASSWORD}"
          else
            keytool -genkeypair -noprompt -keystore build/aura-signing.jks -storepass aura-temp-pass -keypass aura-temp-pass -alias aura-temp -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AURA 0.5-1, OU=HomeMusic, O=AURA, C=SE"
            STORE_PASS=aura-temp-pass
            KEY_PASS=aura-temp-pass
            KEY_ALIAS=aura-temp
          fi
          apksigner sign --ks build/aura-signing.jks --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$KEY_ALIAS" --out build/AURA-0.5-1.apk build/AURA-0.5-1-aligned.apk
          apksigner verify --verbose build/AURA-0.5-1.apk
          aapt dump badging build/AURA-0.5-1.apk | tee build/badging.txt
          grep -F "package: name='app.homemusic'" build/badging.txt
          grep -F "versionName='0.5-1'" build/badging.txt
          grep -F "versionCode='501'" build/badging.txt
          grep -F "application-label:'AURA'" build/badging.txt

      - name: Prepare GitHub update feed and source archive
        run: |
          rm -rf aura-android
          mkdir -p aura-android app build/source
          cp -a build/decoded/. aura-android/
          cat > aura-android/README.md <<'EOF'
          # AURA 0.5-1 Android project

          Complete decoded Apktool project used to build AURA 0.5-1.
          Includes Android resources, assets, native libraries and Smali sources.
          Build with Apktool 3.0.3: `java -jar apktool.jar b aura-android -o AURA-0.5-1-unsigned.apk`.

          This is a complete decompiled/rebuildable project, not the upstream Kotlin/Java Gradle source repository.
          EOF
          APK_SIZE=$(stat -c '%s' build/AURA-0.5-1.apk)
          APK_SHA256=$(sha256sum build/AURA-0.5-1.apk | awk '{print $1}')
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v0.5-1/AURA-0.5-1.apk"
          cat > app/latest.json <<EOF
          {
            "versionCode": 501,
            "versionName": "0.5-1",
            "url": "$APK_URL",
            "size": $APK_SIZE,
            "sha256": "$APK_SHA256",
            "notes": "Единый стиль Хаба, проверка обновлений через GitHub, динамическая версия и контакт автора в Telegram.",
            "patches": [],
            "full": {
              "url": "$APK_URL",
              "size": $APK_SIZE,
              "sha256": "$APK_SHA256"
            }
          }
          EOF
          cp README.md LICENSE HomeMusic.rar build/source/
          cp -R tools assets .github aura-android app build/source/
          (cd build && zip -qr AURA-0.5-1-source.zip source)

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: |
            - Единый тёмный стиль и плавные переходы в разделе «Хаб».
            - Проверка обновлений через GitHub; версия берётся из PackageInfo.
            - Контакт автора в Telegram; кнопка настроек перенесена вправо.
        run: |
          if gh release view v0.5-1 >/dev/null 2>&1; then
            gh release upload v0.5-1 build/AURA-0.5-1.apk build/AURA-0.5-1-source.zip --clobber
            gh release edit v0.5-1 --title "AURA 0.5-1" --notes "$RELEASE_NOTES" --prerelease
          else
            gh release create v0.5-1 build/AURA-0.5-1.apk build/AURA-0.5-1-source.zip --target "$GITHUB_SHA" --title "AURA 0.5-1" --notes "$RELEASE_NOTES" --prerelease
          fi
          gh release edit v0.3 --title "AURA 0.3-2"
          gh release edit v0.4 --title "AURA 0.4-2"

      - name: Publish decoded Android source and update feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura-android app/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish AURA 0.5-1 Android source and update feed"
          fi
          git push origin HEAD:main
          git push --force origin HEAD:pre-release
          git tag -f v0.5-1 HEAD
          git push --force origin refs/tags/v0.5-1
