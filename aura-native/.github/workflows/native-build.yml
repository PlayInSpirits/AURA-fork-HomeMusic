name: Build AURA native Android

"on":
  push:
    branches: [native-v0.10.1]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-native-build
  cancel-in-progress: false

jobs:
  build:
    name: Compile native AURA on Windows self-hosted runner
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'

    steps:
      - name: Checkout native migration branch
        uses: actions/checkout@v4
        with:
          ref: native-v0.10.1

      - name: Verify JDK 17 and Android SDK 37.2
        run: |
          set -euo pipefail
          JAVA_HOME_UNIX="$(cygpath -u "$JAVA_HOME")"
          JAVA_RUNTIME="$JAVA_HOME_UNIX/bin/java.exe"
          [ -f "$JAVA_RUNTIME" ] || { echo "::error::JDK 17 is not available."; exit 1; }
          "$JAVA_RUNTIME" -version

          SDK_ROOT_UNIX=""
          for candidate in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" "$LOCALAPPDATA/Android/Sdk" "$USERPROFILE/AppData/Local/Android/Sdk" "C:/Android"; do
            [ -n "$candidate" ] || continue
            p="$(cygpath -u "$candidate" 2>/dev/null || printf '%s' "$candidate")"
            if [ -d "$p/platforms" ] && [ -d "$p/build-tools" ]; then
              SDK_ROOT_UNIX="$(cd "$p" && pwd -P)"
              break
            fi
          done
          [ -n "$SDK_ROOT_UNIX" ] || { echo "::error::Android SDK root was not found."; exit 1; }

          PLATFORM_DIR="$(find "$SDK_ROOT_UNIX/platforms" -mindepth 1 -maxdepth 1 -type d -name 'android-37*' | sort -V | tail -n 1)"
          [ -n "$PLATFORM_DIR" ] || { echo "::error::Android API 37 platform is not installed."; exit 1; }
          [ -f "$PLATFORM_DIR/android.jar" ] || { echo "::error::android.jar is missing from $PLATFORM_DIR."; exit 1; }

          BUILD_TOOLS_DIR="$(find "$SDK_ROOT_UNIX/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          [ -f "$BUILD_TOOLS_DIR/aapt.exe" ] || { echo "::error::aapt.exe is missing."; exit 1; }

          printf 'JAVA_HOME=%s\n' "$(cygpath -w "$JAVA_HOME_UNIX")" >> "$GITHUB_ENV"
          printf 'ANDROID_HOME=%s\n' "$(cygpath -w "$SDK_ROOT_UNIX")" >> "$GITHUB_ENV"
          printf 'ANDROID_SDK_ROOT=%s\n' "$(cygpath -w "$SDK_ROOT_UNIX")" >> "$GITHUB_ENV"
          printf 'AURA_AAPT=%s\n' "$(cygpath -w "$BUILD_TOOLS_DIR/aapt.exe")" >> "$GITHUB_ENV"
          echo "Using Android platform: $(basename "$PLATFORM_DIR")"
          echo "Using Build Tools: $(basename "$BUILD_TOOLS_DIR")"

      - name: Bootstrap verified Gradle 9.6.0
        run: |
          set -euo pipefail
          GRADLE_VERSION="9.6.0"
          [ -n "$RUNNER_TOOL_CACHE" ] || { echo "::error::RUNNER_TOOL_CACHE is not set."; exit 1; }
          TOOL_CACHE="$(cygpath -u "$RUNNER_TOOL_CACHE")"
          GRADLE_HOME="$TOOL_CACHE/aura-gradle-$GRADLE_VERSION"
          GRADLE_LAUNCHER="$GRADLE_HOME/bin/gradle.bat"
          if [ ! -f "$GRADLE_LAUNCHER" ]; then
            mkdir -p "$TOOL_CACHE" "$RUNNER_TEMP/aura-gradle-download"
            ZIP_UNIX="$(cygpath -u "$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip")"
            SHA_UNIX="$(cygpath -u "$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip.sha256")"
            curl.exe -fL --retry 3 "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" -o "$(cygpath -w "$ZIP_UNIX")"
            curl.exe -fL --retry 3 "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip.sha256" -o "$(cygpath -w "$SHA_UNIX")"
            EXPECTED="$(awk '{print $1}' "$SHA_UNIX" | tr 'A-F' 'a-f')"
            ACTUAL="$(sha256sum "$ZIP_UNIX" | awk '{print $1}')"
            [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::Gradle SHA-256 mismatch: $ACTUAL"; exit 1; }
            EXTRACT_WIN="$(cygpath -w "$RUNNER_TEMP/aura-gradle-download")"
            GRADLE_HOME_WIN="$(cygpath -w "$GRADLE_HOME")"
            ZIP_WIN="$(cygpath -w "$ZIP_UNIX")"
            powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '$ZIP_WIN' -DestinationPath '$EXTRACT_WIN' -Force; New-Item -ItemType Directory -Force -Path '$GRADLE_HOME_WIN' | Out-Null; Copy-Item -Path '$EXTRACT_WIN\gradle-$GRADLE_VERSION\*' -Destination '$GRADLE_HOME_WIN' -Recurse -Force"
          fi
          [ -f "$GRADLE_LAUNCHER" ] || { echo "::error::Gradle launcher is missing after bootstrap."; exit 1; }
          printf 'AURA_GRADLE_BAT=%s\n' "$(cygpath -w "$GRADLE_LAUNCHER")" >> "$GITHUB_ENV"

      - name: Compile :app:assembleDebug
        run: |
          set -euo pipefail
          mkdir -p build-diagnostics
          PROJECT_WIN="$(cygpath -w "$PWD/native-android/project")"
          LOG_WIN="$(cygpath -w "$PWD/build-diagnostics/gradle-build.log")"
          set +e
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '$AURA_GRADLE_BAT' --no-daemon --stacktrace -p '$PROJECT_WIN' :app:assembleDebug *> '$LOG_WIN'; exit \$LASTEXITCODE"
          BUILD_EXIT=$?
          set -e
          echo "$BUILD_EXIT" > build-diagnostics/gradle-build-exit-code.txt
          cat build-diagnostics/gradle-build.log
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error::Native AURA Gradle compile failed; see the uploaded build log."
            exit 1
          fi

          APK="$(find native-android/project/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          [ -n "$APK" ] || { echo "::error::Gradle succeeded but debug APK was not produced."; exit 1; }
          AAPT_UNIX="$(cygpath -u "$AURA_AAPT")"
          "$AAPT_UNIX" dump badging "$APK" | tee build-diagnostics/apk-badging.txt
          grep -F "package: name='app.homemusic' versionCode='7502' versionName='v0.10.1'" build-diagnostics/apk-badging.txt
          echo "Native AURA debug APK compiled and package/version verified."

      - name: Upload native debug APK and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-native-debug
          path: |
            native-android/project/app/build/outputs/apk/debug/*.apk
            build-diagnostics/
          if-no-files-found: warn
          compression-level: 3
          retention-days: 30
