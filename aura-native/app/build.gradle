plugins {
    id 'com.android.application'
}

// The build helpers live in :auratools; its source sets must exist before the tasks below are configured.
evaluationDependsOn(':auratools')

def prebuiltSmali = file('src/main/smali')
def prebuiltDex = layout.buildDirectory.file('aura/prebuilt/prebuilt.dex')
def prebuiltApi = layout.buildDirectory.file('aura/prebuilt/prebuilt-api.jar')

android {
    namespace = 'app.homemusic'
    compileSdk = 37

    defaultConfig {
        applicationId = 'app.homemusic'
        minSdk = 24
        targetSdk = 37
        versionCode = 7502
        versionName = 'v0.10-1'
    }

    buildTypes {
        release {
            // The code is already R8-optimised; the prebuilt smali part relies on exact names.
            minifyEnabled = false
            shrinkResources = false
        }
        debug {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        encoding = 'UTF-8'
    }

    androidResources {
        // Keep every resource id identical to HomeMusic 1.14.7: the prebuilt code has the ids inlined.
        additionalParameters += ['--stable-ids', file('stable-ids.txt').absolutePath]
        noCompress += ['arsc', 'dex', 'png', 'so']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
            keepDebugSymbols += ['**/*.so']
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-nowarn', '-Xmaxerrs', '100000']
    options.warnings = false
}

def auraTools = project(':auratools')
def auraToolsClasspath = auraTools.sourceSets.main.runtimeClasspath

def assemblePrebuiltDex = tasks.register('assemblePrebuiltDex', JavaExec) {
    description = 'Assembles src/main/smali (code kept in smali form) into one dex.'
    dependsOn ':auratools:classes'
    inputs.dir(prebuiltSmali)
    outputs.file(prebuiltDex)
    classpath = auraToolsClasspath
    mainClass = 'aura.build.Main'
    maxHeapSize = '3g'
    args 'smali', prebuiltSmali.absolutePath, prebuiltDex.get().asFile.absolutePath, '24'
}

def prebuiltApiJar = tasks.register('prebuiltApiJar', JavaExec) {
    description = 'Builds the compile-only API jar of the smali part for javac.'
    dependsOn assemblePrebuiltDex, ':auratools:classes'
    inputs.file(prebuiltDex)
    outputs.file(prebuiltApi)
    classpath = auraToolsClasspath
    mainClass = 'aura.build.Main'
    maxHeapSize = '3g'
    args 'apijar', prebuiltDex.get().asFile.absolutePath, prebuiltApi.get().asFile.absolutePath,
            layout.buildDirectory.dir('aura/prebuilt/api-classes').get().asFile.absolutePath
}

dependencies {
    compileOnly files(prebuiltApi).builtBy(prebuiltApiJar)
}

// The decompiled code already contains kotlin-stdlib (and every other library) as classes;
// AGP 9's built-in Kotlin support would add a second copy to the APK.
configurations.configureEach {
    if (name.endsWith('RuntimeClasspath') || name.endsWith('CompileClasspath')) {
        exclude group: 'org.jetbrains.kotlin'
        exclude group: 'org.jetbrains', module: 'annotations'
    }
}

// assembleRelease -> app-release-unsigned.apk, then aura<Variant>Apk adds the prebuilt dex as classesN.dex.
['Release', 'Debug'].each { variant ->
    def v = variant.toLowerCase()
    tasks.register("aura${variant}Apk", JavaExec) {
        description = "Builds the unsigned ${v} APK including the prebuilt dex."
        dependsOn "assemble${variant}", assemblePrebuiltDex, ':auratools:classes'
        def apkDir = layout.buildDirectory.dir("outputs/apk/${v}")
        def outApk = layout.buildDirectory.file("outputs/aura/AURA-native-${v}-unsigned.apk")
        outputs.file(outApk)
        classpath = auraToolsClasspath
        mainClass = 'aura.build.Main'
        doFirst {
            def dir = apkDir.get().asFile
            def apk = fileTree(dir).matching { include '*.apk' }.files.find { !it.name.contains('aura') }
            if (apk == null) throw new GradleException("APK not found in ${dir}")
            outApk.get().asFile.parentFile.mkdirs()
            args 'inject', apk.absolutePath, prebuiltDex.get().asFile.absolutePath, outApk.get().asFile.absolutePath
        }
    }
}
